He2018:
  ENTRYTYPE: unpublished
  abstract: We present a pedagogical introduction to the recent advances in the 
    computational geometry, physical implications, and data science of 
    Calabi-Yau manifolds. Aimed at the beginning research student and using 
    Calabi-Yau spaces as an exciting play-ground, we intend to teach some 
    mathematics to the budding physicist, some physics to the budding 
    mathematician, and some machine-learning to both. Based on various lecture 
    series, colloquia and seminars given by the author in the past year, this 
    writing is a very preliminary draft of a book to appear with Springer, by 
    whose kind permission we post to ArXiv for comments and suggestions.
