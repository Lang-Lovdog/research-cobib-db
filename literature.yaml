Gal2020:
  ENTRYTYPE: unpublished
  abstract: Quantum chromodynamics (QCD) is the theory of the strong 
    interaction. The fundamental particles of QCD, quarks and gluons, carry 
    colour charge and form colourless bound states at low energies. The hadronic
    bound states of primary interest to us are the mesons and the baryons. From 
    knowledge of the meson spectrum, we use neural networks and Gaussian 
    processes to predict the masses of baryons with 90.3% and 96.6% accuracy, 
    respectively. These results compare favourably to the constituent quark 
    model. We as well predict the masses of pentaquarks and other exotic 
    hadrons.
