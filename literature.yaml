WOS:000975679700001:
  ENTRYTYPE: article
  abstract: "Metaheuristics are popularly used in various fields, and they have\n\
    attracted much attention in the scientific and industrial communities.\nIn recent
    years, the number of new metaheuristic names has been\ncontinuously growing. Generally,
    the inventors attribute the novelties\nof these new algorithms to inspirations
    from either biology, human\nbehaviors, physics, or other phenomena. In addition,
    these new\nalgorithms, compared against basic versions of other metaheuristics\n\
    using classical benchmark problems, show competitive performances.\nHowever, many
    new metaheuristics are not rigorously tested on\nchallenging benchmark suites
    and are not compared with state-of-the-art\nmetaheuristic variants. Therefore,
    in this study, we exhaustively\ntabulate more than 500 meta -heuristics. In particular,
    several\nrepresentative metaheuristics are introduced from two aspects, namely,\n\
    the inspirational source and the essential operators for generating\nsolutions.
    To comparatively evaluate the per-formance of the\nstate-of-the-art and newly
    proposed metaheuristics, 11 newly proposed\nmetaheuristics (generally with high
    numbers of citations) and 4\nstate-of-the-art metaheuristics are comprehensively
    compared on the\nCEC2017 benchmark suite. For fair comparisons, a parameter tuning
    tool\nnamed irace is used to automatically configure the parameters of all 15\n\
    algorithms. In addition, whether these algorithms have a search bias to\nthe origin
    (i.e., the center of the search space) is investigated. All\nthe experimental
    results are analyzed by several nonparametric\nstatistical methods, including
    the Bayesian rank-sum test, Friedman\ntest, Wilcoxon signed-rank test, critical
    difference plot and Bayesian\nsigned-rank test. Moreover, the convergence, diversity,
    and the\ntrade-off between exploration and exploitation of these 15 algorithms\n\
    are also analyzed. The results show that the performance of the newly\nproposed
    EBCM algorithm performs similarly to the 4 compared algorithms\nand has the same
    properties and behaviors, such as convergence,\ndiversity, exploration and exploitation
    trade-offs, in many aspects.\nHowever, the other 10 recent metaheuristics are
    less efficient and\nrobust than the 4 state-of-the-art metaheuristics. The performance
    of\nall 15 of the algorithms is likely to deteriorate due to certain\ntransformations,
    while the 4 state-of-the-art metaheuristics are less\naffected by transformations
    such as the shifting of the global optimal\npoint away from the center of the
    search space. It should be noted that,\nexcept EBCM, the other 10 new algorithms
    are inferior to the 4\nstate-of-the-art algorithms in terms of convergence speed
    and global\nsearch ability on CEC 2017 functions. Moreover, the other 10 new\n\
    algorithms are rougher (i.e., present in their behavior with high\noscillations)
    in terms of the trade-off between exploitation and\nexploration and population
    diversity compared with the 4\nstate-of-the-art algorithms. Finally, several important
    issues relevant\nto the metaheuristic research area are discussed and some potential\n\
    research directions are suggested."
