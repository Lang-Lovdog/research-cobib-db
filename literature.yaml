He2022:
  ENTRYTYPE: unpublished
  abstract: We review the recent programme of using machine-learning to explore 
    the landscape of mathematical problems. With this paradigm as a model for 
    human intuition - complementary to and in contrast with the more formalistic
    approach of automated theorem proving - we highlight some experiments on how
    AI helps with conjecture formulation, pattern recognition and computation.
